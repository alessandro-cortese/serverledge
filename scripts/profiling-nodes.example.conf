# Serverledge distributed profiling collection manifest.
#
# Format:
#
# node_name|machine_tag|ssh_target|remote_path|ssh_port
#
# Fields:
#
# node_name:
#   Must match the node_name stored in InvocationSample.
#   Normally this is the Serverledge registry.node.id of the remote node.
#
# machine_tag:
#   Must match the machine_tag stored in InvocationSample.
#
# ssh_target:
#   Standard SSH target, for example:
#       ale@192.168.1.101
#       serverledge-arm
#
#   SSH aliases configured in ~/.ssh/config are supported.
#
# remote_path:
#   Absolute path of the profiling-samples.jsonl produced by that node.
#   Avoid paths containing spaces.
#
# ssh_port:
#   Optional.
#   Use "-" to let SSH use its normal configuration / ~/.ssh/config.
#
# IMPORTANT:
# The remote dataset should belong to the experiment being collected.
# Prefer a dedicated profiling.export.path for each experiment instead of
# mixing samples from unrelated experimental runs in the same append-only file.
#
# Examples:
#
# arm-node-01|arm64|ale@192.168.1.101|/home/ale/serverledge/data/profiling/profiling-samples.jsonl|22
# x86-node-01|x86|ale@192.168.1.102|/home/ale/serverledge/data/profiling/profiling-samples.jsonl|22
#
# If ~/.ssh/config already contains host and port:
#
# arm-node-01|arm64|serverledge-arm|/home/ale/serverledge/data/profiling/profiling-samples.jsonl|-